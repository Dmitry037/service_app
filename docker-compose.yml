version: "3.9"

services:
  web-app:
    build:
      context: .
    ports:
      - "8000:8000"  # Можно убрать этот порт, если запросы будут идти только через Nginx
    volumes:
      - ./service:/service
    environment:
      - DB_HOST=database
      - DB_NAME=dbname
      - DB_USER=dbuser
      - DB_PASS=pass
    depends_on:
      - database

  database:
    image: postgres:14.6-alpine
    environment:
      - POSTGRES_DB=dbname
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=pass

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Подключаем наш конфиг
      - ./service/static:/service/static  # Для статических файлов
    ports:
      - "80:80"
    depends_on:
      - web-app